# docker compose up --build        -> db + one-shot ETL + dashboard on http://localhost:8501
# docker compose run --rm alerts   -> dry-run alert;  add --send to really send
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: inventory
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    command: ["invsales", "all"]          # generate synthetic data + clean + validate + load
    environment: &app-env
      DATABASE_URL: postgresql+psycopg2://inventory:${POSTGRES_PASSWORD:-inventory}@db:5432/inventory
      DATA_DIR: /app/data
    env_file: [{path: .env, required: false}]
    volumes: [appdata:/app/data]
    depends_on:
      db: {condition: service_healthy}

  dashboard:
    build: .
    environment: *app-env
    env_file: [{path: .env, required: false}]
    volumes: [appdata:/app/data]
    ports: ["8501:8501"]
    depends_on:
      etl: {condition: service_completed_successfully}
    restart: unless-stopped

  alerts:
    build: .
    profiles: ["alerts"]
    command: ["invsales", "alerts"]
    environment: *app-env
    env_file: [{path: .env, required: false}]
    volumes: [appdata:/app/data]
    depends_on:
      etl: {condition: service_completed_successfully}

volumes:
  pgdata:
  appdata:
