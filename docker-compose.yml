# docker compose up --build                       -> db + one-shot ETL + dashboard (:8501) + REST API (:8000)
# PRESET=large docker compose up --build          -> same with the 1.5M-row dataset (takes ~1-2 minutes to build)
# docker compose run --rm alerts                  -> dry-run alert;  append --send after configuring .env
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventory}
      POSTGRES_DB: inventory
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  etl:
    build: .
    command: ["invsales", "all"]          # generate + clean + validate + load
    environment: &app-env
      DATABASE_URL: postgresql+psycopg2://inventory:${POSTGRES_PASSWORD:-inventory}@db:5432/inventory
      DATA_DIR: /app/data
      PRESET: ${PRESET:-demo}
    env_file: [{path: .env, required: false}]
    volumes: [appdata:/app/data]
    depends_on:
      db: {condition: service_healthy}

  dashboard:
    build: .
    environment: *app-env
    env_file: [{path: .env, required: false}]
    volumes: [appdata:/app/data]
    ports: ["8501:8501"]
    depends_on:
      etl: {condition: service_completed_successfully}
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "invsales.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      HEALTH_PORT: "8000"
      HEALTH_PATH: health
    env_file: [{path: .env, required: false}]
    volumes: [appdata:/app/data]
    ports: ["8000:8000"]
    depends_on:
      etl: {condition: service_completed_successfully}
    restart: unless-stopped

  alerts:
    build: .
    profiles: ["alerts"]
    command: ["invsales", "alerts"]
    environment: *app-env
    env_file: [{path: .env, required: false}]
    volumes: [appdata:/app/data]
    depends_on:
      etl: {condition: service_completed_successfully}

volumes:
  pgdata:
  appdata:
