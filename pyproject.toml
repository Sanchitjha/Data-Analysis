[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invsales"
version = "1.0.0"
description = "Inventory & Sales Analytics: ETL, PostgreSQL, Streamlit dashboard, reorder alerts"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy", "sqlalchemy>=2.0", "psycopg2-binary", "requests"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
kaggle = ["kaggle"]
dev = ["pytest", "pytest-cov", "ruff", "openpyxl", "matplotlib", "nbformat", "nbconvert", "ipykernel"]

[project.scripts]
invsales = "invsales.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["scripts", "notebooks"]
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
